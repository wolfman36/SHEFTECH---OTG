name: Build SHEFTECH OTG APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract SHEFTECH project
        run: |
          mkdir project
          unzip -q SHEFTECH_OTG_Prototype.zip -d project
          echo "Project extracted:"
          find project -maxdepth 3 -type f | head -50

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: project
        run: chmod +x gradlew && ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHEFTECH-OTG-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
